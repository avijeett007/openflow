name: "Build"

# OpenFlow release/build pipeline.
#
# Flow:  test  ->  build (macOS arm64 + macOS x64 + Windows)  ->  publish
#
#   1. test    Runs the Rust test suite and a frontend typecheck/build as a gate.
#              Nothing builds or ships unless this passes.
#   2. build   Builds installers for all three targets. On a `v*` tag it uploads
#              them to a *draft* GitHub Release; on manual dispatch it only
#              uploads run artifacts.
#   3. publish On a `v*` tag, once every platform has built successfully, flips
#              the draft Release to PUBLISHED so the download links go live. If
#              any build fails the release stays a draft (nothing half-shipped).
#
# macOS signing is CONDITIONAL on the `APPLE_CERTIFICATE` repo secret (see the
# "Configure Apple code signing" step below). Until that secret exists, both
# macOS jobs build UNSIGNED / ad-hoc (`codesign -s -`) exactly as before this
# was wired up — nothing here changes that path. Once the Apple Developer ID
# secrets are added (see SIGNING.md, kept in the parent project root, not in
# this repo), the same jobs sign with the Developer ID identity, apply the
# hardened runtime, notarize, and staple — automatically, on the next `v*` tag.
# Windows Authenticode signing is not wired up (see SIGNING.md Part B).
#
# Triggers:
#   - workflow_dispatch : manual test + build, uploads installers as run artifacts.
#   - push tag v*       : test + build + PUBLISH a GitHub Release with installers.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Test gate — must pass before anything is built or shipped.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libvulkan-dev + glslc + spirv-headers let transcribe-cpp-sys build
          # ggml's Vulkan backend (the Linux `vulkan` feature).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libasound2-dev libssl-dev libgtk-layer-shell-dev \
            libvulkan-dev glslc spirv-headers

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: test-ubuntu

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Typecheck + build the frontend so a broken UI fails the pipeline early
      # (cheap, runs in seconds).
      - name: Frontend typecheck & build
        run: bun run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  # ---------------------------------------------------------------------------
  # 2. Build — one job per target. Gated on `test`.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    needs: test
    permissions:
      # Needed for tauri-action to create/upload the GitHub Release on tags.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-14" # Apple Silicon (arm64) — prebuilt `ort` binary.
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-14" # Intel (x64) — CROSS-COMPILED on Apple Silicon.
            # The `macos-13` Intel runner is retired (jobs sit queued forever), so
            # we cross-compile x86_64 on the arm64 runner instead (see the ONNX +
            # bundling steps below).
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest" # x64 — prebuilt `ort` binary.
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}

    steps:
      # transcribe-cpp-sys's cmake build creates paths that exceed Windows'
      # 260-char MAX_PATH. Enable long paths before checkout touches the tree.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v7

      # Even with long paths enabled, keep the cargo target dir short (C:\t) so
      # deep cmake artifact paths stay well under the limit.
      - name: Shorten build path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          $targetDir = "$drive\t"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          echo "CARGO_TARGET_DIR=$targetDir" >> $env:GITHUB_ENV

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cross-compile x86_64 on the Apple-Silicon runner. The `ort` crate has no
      # prebuilt x86_64-apple-darwin binary, so we dynamically link an x86_64 ONNX
      # Runtime. To get the SAME onnxruntime version the project expects, install
      # an x86_64 Homebrew under Rosetta and `brew install onnxruntime` there.
      # CMAKE_OSX_ARCHITECTURES forces transcribe-cpp's native (ggml/Metal) cmake
      # build to target x86_64. All env vars are exported BEFORE "Build with Tauri".
      - name: Install x86_64 ONNX Runtime via Rosetta Homebrew (Intel cross-compile)
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euxo pipefail
          sudo softwareupdate --install-rosetta --agree-to-license
          # Install an x86_64 Homebrew at /usr/local (the Intel prefix) by running
          # the installer under Rosetta; NONINTERACTIVE avoids the prompt.
          arch -x86_64 /bin/bash -c 'NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
          arch -x86_64 /usr/local/bin/brew install onnxruntime
          {
            echo "ORT_LIB_LOCATION=/usr/local/opt/onnxruntime/lib"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "CMAKE_OSX_ARCHITECTURES=x86_64"
            echo "MACOSX_DEPLOYMENT_TARGET=10.15"
          } >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Apple Developer ID signing + notarization is CONDITIONAL on the
      # `APPLE_CERTIFICATE` secret existing — this step is the single gate for
      # the whole macOS signing story. When the secret is absent, this step
      # only sets APPLE_SIGNING_ENABLED=false and returns; it exports NOTHING
      # else, so every APPLE_* env var tauri-bundler reads (APPLE_CERTIFICATE,
      # APPLE_SIGNING_IDENTITY, ...) is genuinely ABSENT from the process
      # environment for every later step in this job — not set-to-empty. That
      # distinction is load-bearing: tauri-bundler reads these with Rust's
      # `env::var_os(...)`, which returns `Some("")` for a set-but-empty var and
      # takes the "configured" code path anyway (verified against
      # tauri-bundler's `sign::keychain()` and tauri-cli's `APPLE_SIGNING_IDENTITY`
      # handling — an empty-but-set value would override tauri.conf.json's
      # ad-hoc "-" with "" and break codesign). So secrets are only ever
      # forwarded inside the `if` below via $GITHUB_ENV, never unconditionally
      # in a step's `env:` block. When absent: `keychain()` falls through to
      # the ad-hoc "-" identity from tauri.conf.json exactly as it does today,
      # and `notarize_auth()` returns MissingCredentials, which is logged as a
      # warning and skipped — byte-for-byte the same pipeline as before this
      # step existed.
      #
      # When present, this step ALSO imports the certificate into its own
      # long-lived keychain (APPLE_KEYCHAIN_PATH) for the manual `codesign` /
      # `notarytool` calls later in this job ("Bundle ONNX Runtime..." and
      # "Notarize and staple macOS DMG" below) — tauri-bundler's own keychain
      # import (triggered by APPLE_CERTIFICATE, used inside "Build with
      # Tauri") is DELETED the moment that step's process exits (see
      # tauri-macos-sign's `Keychain`'s `Drop` impl), so it can't be reused.
      - name: Configure Apple code signing (macOS, conditional)
        if: contains(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "No APPLE_CERTIFICATE secret set — building unsigned/ad-hoc, unchanged from before."
            exit 0
          fi

          echo "APPLE_SIGNING_ENABLED=true" >> "$GITHUB_ENV"

          # Forward a var into GITHUB_ENV using the heredoc form (safe for any
          # content, including the multi-line base64 .p12) instead of
          # interpolating ${{ secrets.* }} into the script or assignment.
          forward() {
            local name="$1" value="$2"
            {
              echo "${name}<<__OPENFLOW_EOF_${name}__"
              printf '%s\n' "$value"
              echo "__OPENFLOW_EOF_${name}__"
            } >> "$GITHUB_ENV"
          }

          # Vars tauri-bundler itself reads during "Build with Tauri".
          forward APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          forward APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          forward APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"

          # Notarization is DELIBERATELY NOT wired up here. We forward the
          # SIGNING vars above (so `tauri build` still Developer-ID signs +
          # applies the hardened runtime, byte-for-byte as before), but we do
          # NOT forward any notarization credential (APPLE_API_KEY /
          # APPLE_API_ISSUER / APPLE_API_KEY_P8 / APPLE_ID / APPLE_PASSWORD /
          # APPLE_TEAM_ID) into $GITHUB_ENV. With none of those present, Tauri's
          # bundler takes the `notarize_auth() -> MissingCredentials` path and
          # SKIPS its inline notarization (logs a warning), exactly as it does on
          # an unsigned build. That is intentional: Tauri's inline notarization
          # is a single, un-retryable Apple call made from deep inside
          # `tauri build`, so one transient Apple notary 5xx ("please try again
          # later") failed the whole v0.15.5 release with no way to retry.
          #
          # Notarization is instead performed ONCE, on the final .dmg, in the
          # dedicated "Notarize and staple macOS DMG" step below — which wraps
          # `notarytool submit` in an exponential-backoff retry loop that retries
          # transient Apple errors and fails fast on genuine rejections. Apple's
          # notary service notarizes every nested code object inside the
          # submitted .dmg (the .app and its dylibs), so the .app's CDHash is
          # registered as notarized; the byte-identical .app copy shipped in the
          # updater `.app.tar.gz` therefore passes Gatekeeper's online check too.
          # That dedicated step receives the notarization secrets via its own
          # `env:` block (not $GITHUB_ENV), so they are scoped to it alone and can
          # never leak into the `tauri build` environment.
          if [ -n "$APPLE_API_KEY" ]; then
            echo "Notarization (deferred to the DMG step, with retry): App Store Connect API key"
          elif [ -n "$APPLE_ID" ]; then
            echo "Notarization (deferred to the DMG step, with retry): Apple ID + app-specific password (fallback)"
          else
            echo "::warning::APPLE_CERTIFICATE is set but no notarization credentials were found (neither APPLE_API_KEY nor APPLE_ID). The app will be Developer-ID signed but NOT notarized — Gatekeeper will still warn on other Macs."
          fi

          # Our OWN long-lived keychain for the manual codesign/notarytool
          # calls later in this job (see comment above the step name).
          KEYCHAIN_PATH="$RUNNER_TEMP/openflow-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 32)"
          CERT_B64="$RUNNER_TEMP/apple-cert.p12.b64"
          CERT_PATH="$RUNNER_TEMP/apple-cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" > "$CERT_B64"
          openssl base64 -d -A -in "$CERT_B64" -out "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          rm -f "$CERT_B64" "$CERT_PATH"

          echo "APPLE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # tauri-action runs `bun run tauri build` and bundles the app. On tag builds
      # it creates/uploads to a DRAFT GitHub Release (published later by the
      # `publish` job once all platforms succeed). The Apple/Windows code-signing
      # story is unchanged (ad-hoc), but the two TAURI_SIGNING_* secrets are the
      # updater's *minisign* key: with them set (and createUpdaterArtifacts=true)
      # the bundler emits the updater archives AND a `.sig` next to each one.
      #
      # includeUpdaterJson defaults to false, which is what we want: each matrix
      # job only knows its own platform, so letting tauri-action write
      # latest.json would have all three jobs clobber it down to a single
      # platform. The `publish` job assembles a correct multi-platform
      # latest.json from every job's signatures instead, and uploads the
      # per-arch archives + `.sig` under deterministic names (macOS archives are
      # otherwise all named `OpenFlow.app.tar.gz` and would collide across the
      # two mac jobs).
      #
      # NOTE: this step used to also pass `uploadUpdaterJson: false` and
      # `uploadUpdaterSignatures: false`. Neither input has ever existed on
      # tauri-action (verified against action.yml back to v0.5.0) — GitHub
      # Actions silently drops unrecognized `with:` inputs, so they were always
      # no-ops. A more recent v0.6.x picked up an explicit
      # "Unexpected input(s)" warning annotation for this, which is what
      # surfaced on the v0.15.2 build (on all three platforms, including the
      # two that succeeded — this warning alone never failed a build). Removed
      # them here since they did nothing; behavior is unchanged.
      - name: Build with Tauri
        uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # How the Intel .app links ONNX Runtime is NOT fixed — it depends on what
      # else is in the dependency graph, so this step must handle every case
      # instead of assuming a Homebrew dynamic link always exists (that wrong
      # assumption is exactly what broke v0.15.0: `sherpa-onnx-sys` statically
      # links onnxruntime, ld64 then dead-strips the now-unused dynamic
      # `libonnxruntime.1.dylib` load command, `otool` finds nothing, and the old
      # `cp -L ''` failed with exit 1). Three linkage cases:
      #   (a) an external onnxruntime (Homebrew absolute path, or @rpath) — would
      #       crash on a clean Intel Mac; bundle the dylib into Contents/Frameworks,
      #       repoint to @executable_path, re-sign, and verify no brew path remains.
      #   (b) already @executable_path/../Frameworks — verify the dylib is present.
      #   (c) NO dynamic onnxruntime link at all — statically linked and fully
      #       self-contained (sherpa-onnx static build); nothing to bundle, skip.
      # Only cases (a)/(b) mutate the .app, so only they rebuild the dmg and
      # regenerate + re-sign the updater `.app.tar.gz`/`.sig`; case (c) leaves
      # tauri-action's already-correct, self-contained artifacts untouched. The
      # dmg rebuild and updater re-sign live in ONE step on purpose so a fixed .app
      # and its updater archive can never diverge. ONNX_CASE is exported for the
      # assertion gate below.
      - name: Bundle ONNX Runtime into Intel .app and rebuild artifacts
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          MACOS_DIR="src-tauri/target/x86_64-apple-darwin/release/bundle/macos"
          ENTITLEMENTS="src-tauri/Entitlements.plist"
          DEST_ID="@executable_path/../Frameworks/libonnxruntime.1.dylib"

          # 1. Locate the built .app deterministically; fail loudly if it is missing.
          shopt -s nullglob
          APPS=("$MACOS_DIR"/*.app)
          shopt -u nullglob
          if [ "${#APPS[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one .app under $MACOS_DIR, found ${#APPS[@]}" >&2
            ls -la "$MACOS_DIR" >&2 || true
            exit 1
          fi
          APP="${APPS[0]}"
          BIN="$APP/Contents/MacOS/openflow"
          FW="$APP/Contents/Frameworks/libonnxruntime.1.dylib"
          echo "app: $APP"

          # 2. Classify the onnxruntime linkage. `otool -L` prints tab-indented
          #    "<path> (compatibility ...)" lines; awk's $1 is the clean dylib path.
          CUR="$(otool -L "$BIN" | awk '/libonnxruntime/ {print $1; exit}')"
          echo "linked onnxruntime: '${CUR:-<none>}'"

          if [ -z "$CUR" ]; then
            # (c) Statically linked (no dynamic dependency). Self-contained — nothing
            #     to bundle. tauri-action's dmg + updater archive are already correct.
            echo "onnxruntime is statically linked (no dynamic dependency) — skipping bundling"
            echo "ONNX_CASE=c" >> "$GITHUB_ENV"
            exit 0
          elif [[ "$CUR" == "$DEST_ID" ]]; then
            # (b) Already repointed into the bundle — just confirm the dylib exists.
            [ -f "$FW" ] || { echo "ERROR: binary links $DEST_ID but $FW is missing" >&2; exit 1; }
            echo "onnxruntime already bundled at $DEST_ID"
            echo "ONNX_CASE=b" >> "$GITHUB_ENV"
          else
            # (a) External onnxruntime (brew absolute path or @rpath). Bundle it.
            echo "ONNX_CASE=a" >> "$GITHUB_ENV"
            mkdir -p "$APP/Contents/Frameworks"
            if [ -f "$CUR" ]; then
              SRC="$CUR"                                            # absolute path present on the runner
            elif [ -n "${ORT_LIB_LOCATION:-}" ] && [ -f "$ORT_LIB_LOCATION/libonnxruntime.1.dylib" ]; then
              SRC="$ORT_LIB_LOCATION/libonnxruntime.1.dylib"        # @rpath / non-resolvable: fall back to ORT_LIB_LOCATION
            else
              echo "ERROR: cannot locate a source libonnxruntime.1.dylib (linked '$CUR', ORT_LIB_LOCATION='${ORT_LIB_LOCATION:-}')" >&2
              exit 1
            fi
            echo "bundling from: $SRC"
            cp -L "$SRC" "$FW"
            chmod u+w "$FW"
            install_name_tool -id "$DEST_ID" "$FW"
            install_name_tool -change "$CUR" "$DEST_ID" "$BIN"

            # Re-signing is unavoidable here: the dylib copy + install_name_tool
            # rewrite invalidate any prior signature. Same identity + options
            # tauri-bundler would use: ad-hoc "-" when Apple signing is
            # disabled (unchanged from before this PR), or Developer ID +
            # hardened runtime from our own keychain (see "Configure Apple
            # code signing" step) when enabled — an ad-hoc-signed nested
            # dylib inside a hardened-runtime app is exactly what
            # notarization rejects, so both must match when enabled.
            if [ "${APPLE_SIGNING_ENABLED:-false}" = "true" ]; then
              CODESIGN_ARGS=(-s "$APPLE_SIGNING_IDENTITY" --keychain "$APPLE_KEYCHAIN_PATH" --options runtime)
            else
              CODESIGN_ARGS=(-s -)
            fi
            codesign --force "${CODESIGN_ARGS[@]}" "$FW"
            # Entitlements already carry disable-library-validation for the ad-hoc/Developer-ID sig.
            codesign --force "${CODESIGN_ARGS[@]}" --entitlements "$ENTITLEMENTS" "$APP"
            codesign --verify --deep --strict "$APP"
            # Hard-verify: @executable_path present AND no absolute brew path remains.
            POST="$(otool -L "$BIN" | grep -i onnxruntime || true)"
            echo "post-bundle onnxruntime links:"; echo "$POST"
            echo "$POST" | grep -qF "$DEST_ID" \
              || { echo "ERROR: expected $DEST_ID after bundling, got: $POST" >&2; exit 1; }
            if echo "$POST" | grep -Eq '(/usr/local/|/opt/homebrew/)[^ ]*onnxruntime'; then
              echo "ERROR: an absolute brew onnxruntime path still remains: $POST" >&2; exit 1
            fi
            [ -f "$FW" ] || { echo "ERROR: $FW missing after bundling" >&2; exit 1; }

            # The re-sign above changed the .app's CDHash, so it must be
            # notarized AFTER this point — but we no longer do it inline here.
            # Notarization is done once, on the FINAL .dmg, in the dedicated
            # "Notarize and staple macOS DMG" step (with a retry/backoff loop).
            # Apple notarizes every nested code object inside a submitted .dmg,
            # so this re-signed .app's CDHash — identical in the rebuilt .dmg and
            # in the updater `.app.tar.gz` below (both are copies of this exact
            # signed bundle) — is registered as notarized and passes Gatekeeper's
            # online check. Doing it once, on the .dmg, is what makes the retry
            # loop possible; the previous inline `.app` notarytool call here was
            # un-retryable and was a second Apple call that could fail a release.
          fi

          # 3. The .app changed (case a/b): rebuild the dmg AND regenerate + re-sign
          #    the updater archive from the SAME fixed .app so the dmg, the
          #    `.app.tar.gz`, and its `.sig` can never disagree. On tag builds,
          #    replace the pre-fix dmg tauri-action uploaded.
          VER="$(node -p "require('./package.json').version")"
          DMG="src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/OpenFlow_${VER}_x64.dmg"
          STAGE="$(mktemp -d)"
          ditto "$APP" "$STAGE/OpenFlow.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "OpenFlow" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          # This freshly-built dmg has no signature at all (unchanged from
          # before this PR) unless Apple signing is enabled, in which case
          # sign it with the Developer ID identity so it matches what
          # tauri-bundler's own dmg.rs would produce. Notarization + stapling
          # of the FINAL dmg (this one, or the untouched case-b/c dmg) happens
          # in the separate "Notarize and staple macOS DMG" step below, which
          # runs for both macOS legs after every dmg mutation is done.
          if [ "${APPLE_SIGNING_ENABLED:-false}" = "true" ]; then
            codesign --force -s "$APPLE_SIGNING_IDENTITY" --keychain "$APPLE_KEYCHAIN_PATH" "$DMG"
          fi
          ls -lh "$DMG"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release upload "${GITHUB_REF#refs/tags/}" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"
          fi
          # COPYFILE_DISABLE avoids AppleDouble `._*` entries in the archive.
          rm -f "$MACOS_DIR/OpenFlow.app.tar.gz" "$MACOS_DIR/OpenFlow.app.tar.gz.sig"
          COPYFILE_DISABLE=1 tar -C "$MACOS_DIR" -czf "$MACOS_DIR/OpenFlow.app.tar.gz" OpenFlow.app
          bun tauri signer sign "$MACOS_DIR/OpenFlow.app.tar.gz"
          ls -lh "$MACOS_DIR/OpenFlow.app.tar.gz" "$MACOS_DIR/OpenFlow.app.tar.gz.sig"

      # Publish gate for the "Intel onnxruntime linkage" bug class: no downloads,
      # just inspect the .app in place. ALWAYS fail if any external brew
      # onnxruntime path survives. For the bundled cases (a/b) also assert the
      # dylib is in Frameworks, the binary points at @executable_path, and the
      # updater archive actually contains it — the exact things that were wrong or
      # unverified before. For the static case (c) assert the binary is genuinely
      # self-contained (no dynamic onnxruntime dependency at all).
      - name: Assert Intel .app onnxruntime linkage (publish gate)
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euxo pipefail
          MACOS_DIR="src-tauri/target/x86_64-apple-darwin/release/bundle/macos"
          shopt -s nullglob
          APPS=("$MACOS_DIR"/*.app)
          shopt -u nullglob
          [ "${#APPS[@]}" -eq 1 ] || { echo "ERROR: expected one .app, found ${#APPS[@]}" >&2; ls -la "$MACOS_DIR" >&2 || true; exit 1; }
          APP="${APPS[0]}"
          BIN="$APP/Contents/MacOS/openflow"

          LINKS="$(otool -L "$BIN" | grep -i onnxruntime || true)"
          echo "onnxruntime links: '${LINKS:-<none>}'"
          # Universal gate: an absolute brew path must never survive into a shipped app.
          if echo "$LINKS" | grep -Eq '(/usr/local/|/opt/homebrew/)[^ ]*onnxruntime'; then
            echo "ERROR: shipped Intel .app still links an absolute brew onnxruntime path" >&2
            exit 1
          fi

          case "${ONNX_CASE:-}" in
            a|b)
              echo "case $ONNX_CASE: expecting a bundled dylib"
              ls -la "$APP/Contents/Frameworks/"
              [ -f "$APP/Contents/Frameworks/libonnxruntime.1.dylib" ] \
                || { echo "ERROR: Frameworks/libonnxruntime.1.dylib missing" >&2; exit 1; }
              echo "$LINKS" | grep -qF "@executable_path/../Frameworks/libonnxruntime.1.dylib" \
                || { echo "ERROR: binary does not link @executable_path onnxruntime" >&2; exit 1; }
              tar -tzf "$MACOS_DIR/OpenFlow.app.tar.gz" | grep -qi 'Frameworks/libonnxruntime' \
                || { echo "ERROR: updater archive lacks Frameworks/libonnxruntime" >&2; exit 1; }
              echo "PASS: onnxruntime bundled + repointed + present in updater archive"
              ;;
            c)
              echo "case c: expecting a self-contained (statically linked) binary"
              [ -z "$LINKS" ] || { echo "ERROR: case c but a dynamic onnxruntime link exists: $LINKS" >&2; exit 1; }
              echo "PASS: onnxruntime statically linked, no external dependency"
              ;;
            *)
              echo "ERROR: ONNX_CASE not set by the bundle step (was it skipped?)" >&2
              exit 1
              ;;
          esac

      # Notarize + staple the FINAL dmg for both macOS legs. This is now the
      # SINGLE notarization point for the whole macOS build: Tauri no longer
      # notarizes inline (the "Configure Apple code signing" step deliberately
      # withholds the notarization creds from `tauri build`), and the Intel
      # "Bundle ONNX" step no longer re-notarizes the .app. tauri-bundler only
      # code-signs the dmg (see macos/dmg/mod.rs — it never calls notarytool),
      # and for the Intel leg the dmg may have been rebuilt outside tauri, so
      # this runs as one standalone step AFTER every dmg mutation, for both legs.
      #
      # Apple's notary service notarizes every nested code object inside the
      # submitted dmg (the .app and its dylibs), so notarizing the dmg here
      # registers the .app's CDHash as notarized — and the byte-identical .app
      # copy shipped in the updater `.app.tar.gz` therefore passes Gatekeeper's
      # online check. The standalone updater .app is no longer individually
      # STAPLED (an offline ticket) as it was when Tauri notarized inline; that
      # is immaterial for OTA updates, which write the bundle without a
      # quarantine attribute so Gatekeeper does no notarization gate on it. The
      # downloadable dmg — the artifact users actually double-click — IS stapled
      # here, exactly as before.
      #
      # The submit is wrapped in an exponential-backoff RETRY loop. Apple's
      # notary service periodically returns HTTP 5xx / "try again later"; that
      # transient error (not any fault of ours) failed the v0.15.5 release twice
      # with no retry. We retry ONLY transient errors and fail FAST on a genuine
      # rejection (status Invalid/Rejected), surfacing Apple's log.
      #
      # No-op (skipped entirely) when Apple signing is disabled. On tag builds,
      # re-uploads the now-stapled dmg over whatever this job already uploaded.
      - name: Notarize and staple macOS DMG
        if: contains(matrix.platform, 'macos') && env.APPLE_SIGNING_ENABLED == 'true'
        shell: bash
        # Notarization creds live ONLY on this step (never in $GITHUB_ENV), so
        # they cannot reach `tauri build` and re-enable inline notarization.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Intentionally NOT `set -x`: this step handles the notary secrets
          # (.p8 / app-specific password) and tracing would echo them. GitHub
          # masks registered secrets, but we avoid the risk entirely. `pipefail`
          # still surfaces failures inside pipes.
          set -euo pipefail

          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          shopt -s nullglob
          DMGS=("$DMG_DIR"/*.dmg)
          shopt -u nullglob
          [ "${#DMGS[@]}" -eq 1 ] || { echo "ERROR: expected one dmg in $DMG_DIR, found ${#DMGS[@]}" >&2; ls -la "$DMG_DIR" >&2 || true; exit 1; }
          DMG="${DMGS[0]}"

          # Build notarytool auth args. App Store Connect API key preferred
          # (headless, no 2FA); Apple ID + app-specific password as fallback.
          AUTH=()
          if [ -n "${APPLE_API_KEY:-}" ]; then
            mkdir -p "$RUNNER_TEMP/private_keys"
            KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            AUTH=(--key "$KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
            echo "Notarization auth: App Store Connect API key"
          elif [ -n "${APPLE_ID:-}" ]; then
            AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
            echo "Notarization auth: Apple ID + app-specific password (fallback)"
          else
            echo "::error::APPLE_SIGNING_ENABLED is true but no notarization credentials are present (neither APPLE_API_KEY nor APPLE_ID)." >&2
            exit 1
          fi

          # Retry policy: 5 attempts, backoff 30s -> 60s -> 120s -> 240s
          # (capped at 480s). Retry transient Apple errors only; fail fast on a
          # real rejection.
          MAX_ATTEMPTS=5
          DELAY=30
          attempt=1
          while :; do
            echo "notarytool submit — attempt ${attempt}/${MAX_ATTEMPTS} for $(basename "$DMG")"
            set +e
            OUT="$(xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --timeout 30m 2>&1)"
            RC=$?
            set -e
            echo "$OUT"

            if [ "$RC" -eq 0 ] && grep -q "status: Accepted" <<<"$OUT"; then
              echo "Notarization Accepted."
              break
            fi

            # Genuine rejection (e.g. unsigned nested binary, bad entitlement):
            # do NOT retry — surface Apple's log and fail immediately.
            if grep -Eq "status: (Invalid|Rejected)" <<<"$OUT"; then
              SUB_ID="$(grep -Eo 'id: [0-9a-f-]{36}' <<<"$OUT" | head -n1 | awk '{print $2}')"
              echo "::error::Notarization was REJECTED by Apple (status Invalid/Rejected) — not transient, not retrying. Submission id: ${SUB_ID:-unknown}"
              if [ -n "${SUB_ID:-}" ]; then
                echo "----- notarytool log ${SUB_ID} -----"
                xcrun notarytool log "$SUB_ID" "${AUTH[@]}" || true
              fi
              exit 1
            fi

            # Retry only on a recognized TRANSIENT signature (HTTP 5xx / timeout
            # / connection / "try again later"). An unrecognized error (e.g. bad
            # credentials) fails fast instead of burning retries and masking it.
            if ! grep -Eiq 'HTTP status code: 5[0-9][0-9]|try again|temporarily unavailable|timed out|timeout|could not connect|connection (reset|refused|error|closed)|network is unreachable|unable to connect|service unavailable|internal server error|bad gateway|gateway timeout' <<<"$OUT"; then
              echo "::error::Notarization failed with a non-transient, non-rejection error — not retrying (see output above)." >&2
              exit 1
            fi

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Notarization still failing after ${MAX_ATTEMPTS} attempts against Apple's notary service (transient 5xx/timeout). Failing so the release is not shipped un-notarized." >&2
              exit 1
            fi

            echo "::warning::Transient Apple notary error on attempt ${attempt}/${MAX_ATTEMPTS}; retrying in ${DELAY}s"
            sleep "$DELAY"
            attempt=$((attempt + 1))
            DELAY=$((DELAY * 2))
            [ "$DELAY" -gt 480 ] && DELAY=480
          done

          echo "Stapling $DMG"
          xcrun stapler staple "$DMG"
          spctl -a -vvv -t install "$DMG" || echo "::warning::spctl assessment on the stapled dmg did not report success (informational, non-fatal — notarytool --wait already gated on Accepted)"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release upload "${GITHUB_REF#refs/tags/}" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"
          fi

      # Always upload the installers as workflow run artifacts (for both manual
      # dispatch and tag builds). macOS -> .dmg, Windows -> .exe (NSIS) + .msi.
      - name: Upload installers (macOS)
        if: contains(matrix.platform, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: openflow-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 30

      # Windows bundles land under the shortened CARGO_TARGET_DIR (C:\t), not
      # src-tauri/target, because of the "Shorten build path" step above.
      - name: Upload installers (Windows)
        if: contains(matrix.platform, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: openflow-${{ matrix.target }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle/nsis/*.exe
            ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

      # Updater artifacts (the archive the app self-updates from + its `.sig`),
      # kept in a SEPARATE per-target run artifact so the `publish` job can pull
      # each platform's signed archive without the macOS `OpenFlow.app.tar.gz`
      # name colliding across the two mac jobs. macOS -> .app.tar.gz(+.sig);
      # Windows -> the NSIS -setup.exe(+.sig).
      - name: Upload updater artifacts (macOS)
        if: contains(matrix.platform, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: openflow-updater-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 30

      - name: Upload updater artifacts (Windows)
        if: contains(matrix.platform, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: openflow-updater-${{ matrix.target }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. Publish — flip the draft Release to published, only after ALL platforms
  #    built successfully and only on a `v*` tag. Keeps a failed matrix from
  #    shipping a half-populated release.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pull every platform's signed updater archive + `.sig` (one run artifact
      # per target, so the identically-named macOS archives don't collide).
      - name: Download updater artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: openflow-updater-*
          path: updater-dl

      # Assemble ONE multi-platform latest.json from the per-target signatures and
      # attach it (plus the per-arch archives + sigs under deterministic names) to
      # the draft release. The updater endpoint
      # (releases/latest/download/latest.json) serves this after the release is
      # published + marked latest below. Schema: Tauri v2 static updater manifest.
      - name: Assemble and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          NOTES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body || true)"
          if [ -z "$NOTES" ]; then
            NOTES="See https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          fi

          DA_DIR="updater-dl/openflow-updater-aarch64-apple-darwin"
          DX_DIR="updater-dl/openflow-updater-x86_64-apple-darwin"
          WX_DIR="updater-dl/openflow-updater-x86_64-pc-windows-msvc"

          # Canonical, collision-free asset names. Renaming does not invalidate a
          # signature — minisign signs the archive bytes, not the filename.
          DA_ASSET="OpenFlow_aarch64.app.tar.gz"
          DX_ASSET="OpenFlow_x64.app.tar.gz"
          WX_SRC="$(ls "$WX_DIR"/*-setup.exe)"
          WX_ASSET="$(basename "$WX_SRC")"

          cp "$DA_DIR/OpenFlow.app.tar.gz"       "$DA_ASSET"
          cp "$DA_DIR/OpenFlow.app.tar.gz.sig"   "$DA_ASSET.sig"
          cp "$DX_DIR/OpenFlow.app.tar.gz"       "$DX_ASSET"
          cp "$DX_DIR/OpenFlow.app.tar.gz.sig"   "$DX_ASSET.sig"
          cp "$WX_SRC"                           "$WX_ASSET"
          cp "$WX_SRC.sig"                       "$WX_ASSET.sig"

          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg da_url "$DL/$DA_ASSET" --rawfile da_sig "$DA_ASSET.sig" \
            --arg dx_url "$DL/$DX_ASSET" --rawfile dx_sig "$DX_ASSET.sig" \
            --arg wx_url "$DL/$WX_ASSET" --rawfile wx_sig "$WX_ASSET.sig" \
            '{
               version: $version,
               notes: $notes,
               pub_date: $pub_date,
               platforms: {
                 "darwin-aarch64": { signature: ($da_sig | rtrimstr("\n")), url: $da_url },
                 "darwin-x86_64":  { signature: ($dx_sig | rtrimstr("\n")), url: $dx_url },
                 "windows-x86_64": { signature: ($wx_sig | rtrimstr("\n")), url: $wx_url }
               }
             }' > latest.json
          cat latest.json

          # tauri-action may have uploaded the ambiguous default-named macOS
          # archive; drop it so only the per-arch assets remain (best-effort).
          gh release delete-asset "$TAG" "OpenFlow.app.tar.gz" -y --repo "$GITHUB_REPOSITORY" || true
          gh release delete-asset "$TAG" "OpenFlow.app.tar.gz.sig" -y --repo "$GITHUB_REPOSITORY" || true

          gh release upload "$TAG" \
            "$DA_ASSET" "$DA_ASSET.sig" \
            "$DX_ASSET" "$DX_ASSET.sig" \
            "$WX_ASSET" "$WX_ASSET.sig" \
            latest.json \
            --clobber --repo "$GITHUB_REPOSITORY"

      # tauri-action created the release as a draft (coalesced onto the same tag).
      # Publish it now that every installer is attached.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing release ${GITHUB_REF_NAME}"
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest
          echo "Release ${GITHUB_REF_NAME} is now public:"
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url
